<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 42.339 43.019"
     overflow="visible"
     class="icon play"
     color="#5D013A"
     data-icon="ai-1"
     data-animation="draw-and-pop"
     data-version="1"
     data-title="Draw and pop"
     data-description="The frame draws itself while the stars pop in from bottom left to top right."
     data-duration="1.22"
     data-hold="0.75"
     data-overscan="4.5"
     data-default-color="#5D013A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    /* Draw and pop: the frame draws itself out from its bottom-left corner toward both open ends,
       then the three stars pop in along the same diagonal, bottom-left to top-right. */
    .move-star-left { transform-box: view-box; transform-origin: 13.764px 29.834px; }
    .move-star-big { transform-box: view-box; transform-origin: 26.582px 15.718px; }
    .move-star-small { transform-box: view-box; transform-origin: 35.97px 6.33px; }

    /* Frame: pen reveal growing both ways from the corner. Ends on "none" so no seam remains. */
    .play .mask-draw { animation: draw-and-pop-draw calc(0.8s * var(--s, 1)) cubic-bezier(.65, 0, .35, 1) calc(0s * var(--s, 1)) both; }
    @keyframes draw-and-pop-draw {
      0%     { stroke-dasharray: 0 49.301 0 50.699; }
      99.9%  { stroke-dasharray: 0 0 100 0; }
      100%   { stroke-dasharray: none; }
    }

    /* Stars: a quarter-turn twinkle with a small overshoot. Left star turns the other way. */
    .play .move-star-left  { animation: draw-and-pop-pop-ccw calc(0.5s * var(--s, 1)) cubic-bezier(.34, 1.56, .64, 1) calc(0.22s * var(--s, 1)) both; }
    .play .move-star-big   { animation: draw-and-pop-pop-cw calc(0.6s * var(--s, 1)) cubic-bezier(.34, 1.56, .64, 1) calc(0.48s * var(--s, 1)) both; }
    .play .move-star-small { animation: draw-and-pop-pop-cw calc(0.5s * var(--s, 1)) cubic-bezier(.34, 1.56, .64, 1) calc(0.72s * var(--s, 1)) both; }
    @keyframes draw-and-pop-pop-cw  { from { transform: rotate(-90deg) scale(0); } to { transform: none; } }
    @keyframes draw-and-pop-pop-ccw { from { transform: rotate(90deg) scale(0); } to { transform: none; } }
  </style>
  <defs>
    <mask id="draw-and-pop-mask-frame" maskUnits="userSpaceOnUse" x="-10" y="-10" width="62.339" height="63.019"><path class="mask-draw" d="M20,8.752H5.319A4.719,4.719,0,0,0,.6,13.471V37.7A4.719,4.719,0,0,0,5.319,42.419H29.548A4.719,4.719,0,0,0,34.267,37.7V21.6" pathLength="100" fill="none" stroke="#fff" stroke-width="3"/></mask>
  </defs>
