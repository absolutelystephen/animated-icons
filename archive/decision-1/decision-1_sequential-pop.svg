<?xml version="1.0" encoding="UTF-8"?>
<!-- Huron animated icon. Built to docs/house-rules.md. Artwork from source/decision_1.svg, unchanged. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 69.197 43.523" overflow="visible" class="icon play" color="#5D013A"
     data-icon="decision-1" data-animation="sequential-pop" data-version="1"
     data-title="Sequential pop" data-description="The person pops in, then the X option, then the check option, each with a soft overshoot."
     data-duration="1.3" data-hold="0.75" data-overscan="1.5" data-default-color="#5D013A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.icon { --s: 1; }
.move-person, .move-option-left, .move-option-right { transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes sequential-pop-in { from { opacity: 0; transform: scale(.35); } to { opacity: 1; transform: none; } }
.play .move-person { animation: sequential-pop-in calc(0.6s * var(--s, 1)) cubic-bezier(.34, 1.56, .64, 1) calc(0s * var(--s, 1)) both; }
.play .move-option-left { animation: sequential-pop-in calc(0.55s * var(--s, 1)) cubic-bezier(.34, 1.56, .64, 1) calc(0.45s * var(--s, 1)) both; }
.play .move-option-right { animation: sequential-pop-in calc(0.55s * var(--s, 1)) cubic-bezier(.34, 1.56, .64, 1) calc(0.75s * var(--s, 1)) both; }
</style>
